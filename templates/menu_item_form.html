{% extends "base.html" %}

{% block title %}{{ 'Edit Menu Dish' if item else 'Add New Menu Dish' }} — QuickBite{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h3 class="fw-bold text-dark mb-1">{{ 'Edit Menu Dish' if item else 'Add New Menu Dish' }}</h3>
                        <p class="text-muted small mb-0">{{ restaurant.name }}</p>
                    </div>
                    <a href="{{ url_for('restaurant_dashboard') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                    </a>
                </div>

                <form action="{{ url_for('menu_item_edit', item_id=item.item_id) if item else url_for('menu_item_create', restaurant_id=restaurant.restaurant_id) }}" method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold">Dish Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control rounded-3" 
                                   placeholder="e.g. Truffle Mushroom Risotto" 
                                   value="{{ item.name if item else '' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Price ($) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white">$</span>
                                <input type="number" step="0.01" min="0.50" name="price" class="form-control" 
                                       placeholder="12.99" 
                                       value="{{ item.price if item else '' }}" required>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                            <select name="category_id" class="form-select rounded-3" required>
                                {% for cat in categories %}
                                <option value="{{ cat.category_id }}" {% if item and item.category_id == cat.category_id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Dietary Classification</label>
                            <select name="dietary_type" class="form-select rounded-3">
                                <option value="veg" {% if item and item.dietary_type == 'veg' %}selected{% endif %}>Vegetarian (Veg)</option>
                                <option value="non-veg" {% if item and item.dietary_type == 'non-veg' %}selected{% endif %}>Non-Vegetarian</option>
                                <option value="vegan" {% if item and item.dietary_type == 'vegan' %}selected{% endif %}>Strict Vegan</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description" class="form-control rounded-3" rows="3" 
                                  placeholder="Provide ingredients, cooking method, flavor profile...">{{ item.description if item else '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Image URL (Unsplash or Direct Link)</label>
                        <input type="url" name="image_url" class="form-control rounded-3" 
                               placeholder="https://images.unsplash.com/..." 
                               value="{{ item.image_url if item else '' }}">
                    </div>

                    <div class="row g-3 mb-4 pt-2">
                        <div class="col-md-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_spicy" id="spicyCheck" {% if item and item.is_spicy %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="spicyCheck">🌶️ Spicy Flavor</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_popular" id="popularCheck" {% if item and item.is_popular %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="popularCheck">⭐ Chef Bestseller</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" name="is_available" id="availCheck" {% if not item or item.status == 'available' %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="availCheck">✅ In Stock</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-warning text-dark fw-bold btn-lg rounded-pill w-100 shadow-sm">
                        {{ 'Update Menu Item' if item else 'Save & Add to Menu' }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
